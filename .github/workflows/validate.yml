name: Chug validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Baseline and adversarial evaluations
        run: |
          python3 -m tests.evaluate
          python3 -m tests.adversarial_audit
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/decision-log.js
          node --test tests/test_web_ui.mjs
